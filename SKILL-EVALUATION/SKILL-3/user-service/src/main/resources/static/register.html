<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JobPortal | Create Account</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="page-container">

        <div class="brand-section">

            <div class="brand-logo">
                JP
            </div>

            <h1>
                JobPortal
            </h1>

            <p>
                Your next opportunity
                starts here.
            </p>

            <div class="benefits">

                <div class="benefit">
                    <span>✓</span>
                    Discover new jobs
                </div>

                <div class="benefit">
                    <span>✓</span>
                    Build your career
                </div>

                <div class="benefit">
                    <span>✓</span>
                    Apply with confidence
                </div>

            </div>

        </div>


        <div class="auth-card register-card">

            <div class="card-header">

                <span class="eyebrow">
                    GET STARTED
                </span>

                <h2>
                    Create account
                </h2>

                <p>
                    Register to start applying
                    for jobs.
                </p>

            </div>


            <form id="registerForm">


                <!-- Username -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        autocomplete="username"
                    >

                    <small
                        class="field-error"
                        id="usernameError"
                    ></small>

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                    >

                    <small
                        class="field-error"
                        id="emailError"
                    ></small>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Minimum 6 characters"
                            autocomplete="new-password"
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('password', this)"
                        >
                            Show
                        </button>

                    </div>

                    <small
                        class="field-error"
                        id="passwordError"
                    ></small>

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Repeat your password"
                            autocomplete="new-password"
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword(
                                'confirmPassword',
                                this
                            )"
                        >
                            Show
                        </button>

                    </div>

                    <small
                        class="field-error"
                        id="confirmPasswordError"
                    ></small>

                </div>


                <div
                    id="registerMessage"
                    class="message"
                ></div>


                <button
                    type="submit"
                    class="primary-button"
                    id="registerButton"
                >
                    Create Account
                </button>

            </form>


            <div class="auth-footer">

                <p>

                    Already have an account?

                    <a href="index.html">
                        Sign in
                    </a>

                </p>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
